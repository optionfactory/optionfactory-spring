appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.charset = UTF-8
appender.console.layout.pattern = [%d{yyyy-MM-dd'T'HH:mm:ss,SSS}{UTC}Z][data-jpa][%p][%F:%L] %m%n
 
rootLogger.level=info
rootLogger.appenderRef.stdout.ref=STDOUT

logger.jpaTxMgr.name = org.springframework.orm.jpa.JpaTransactionManager
logger.jpaTxMgr.level = DEBUG
logger.jpaTxMgr.filter.regex.type = RegexFilter
logger.jpaTxMgr.filter.regex.regex = .*(Creating new transaction|Initiating transaction).*
logger.jpaTxMgr.filter.regex.onMatch = ACCEPT
logger.jpaTxMgr.filter.regex.onMismatch = DENY